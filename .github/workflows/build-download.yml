name: Build Download Edition

on:
  push:
    branches:
      - download
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Android:
    name: Android
    # 固定系统版本：ubuntu-latest 将于 2026-10-19 切到 Ubuntu 26，可能导致构建环境突变
    runs-on: ubuntu-24.04
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      # 上游代码本身有 lint 报错，这里只做提示、不阻断构建
      - name: Eslint check
        continue-on-error: true
        run: npm run lint

      # 没有配置私有签名时，使用仓库自带的 debug.keystore 签名，保证每次构建签名一致、可以覆盖升级
      - name: Build Packages
        shell: bash
        run: |
          set -o pipefail
          cd android
          exec > >(tee ../build.log) 2>&1
          # 只编手机用的 ARM 架构，x86 是模拟器/少数平板用的，省下约一半编译时间
          ABI_ARGS='-PreactNativeArchitectures=armeabi-v7a,arm64-v8a'
          if [ -n "${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}" ]; then
            echo ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }} | base64 --decode > app/${{ secrets.KEYSTORE_STORE_FILE }}
            ./gradlew assembleRelease $ABI_ARGS -PMYAPP_UPLOAD_STORE_FILE='${{ secrets.KEYSTORE_STORE_FILE }}' -PMYAPP_UPLOAD_KEY_ALIAS='${{ secrets.KEYSTORE_KEY_ALIAS }}' -PMYAPP_UPLOAD_STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' -PMYAPP_UPLOAD_KEY_PASSWORD='${{ secrets.KEYSTORE_KEY_PASSWORD }}'
          else
            ./gradlew assembleRelease $ABI_ARGS -PMYAPP_UPLOAD_STORE_FILE=debug.keystore -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey -PMYAPP_UPLOAD_STORE_PASSWORD=android -PMYAPP_UPLOAD_KEY_PASSWORD=android
          fi

      # 失败时把关键报错写成注释（annotation），不登录也能看到
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # 每个 step 最多显示 10 条注释，所以把多行合成一条（%0A 是换行）
          msg=$(grep -i -E "error|failed|wrong|exception|unable to" build.log | grep -v -i "warning" | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=build errors::${msg}"
          msg=$(tail -60 build.log | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=build log tail::${msg}"

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}-download.${{ github.run_number }}
          name: v${{ env.PACKAGE_VERSION }} download edition (${{ github.run_number }})
          body: 在官方 v${{ env.PACKAGE_VERSION }} 基础上加入歌曲下载功能。一般手机下载 arm64-v8a 版即可，不确定就下 universal 版。
          files: android/app/build/outputs/apk/release/*.apk
